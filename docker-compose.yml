# Phase 0: database only. Uncomment services as each phase is implemented.
# See docs/IMPLEMENTATION-ROADMAP.md

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartcity-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

