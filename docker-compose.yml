# See docs/IMPLEMENTATION-ROADMAP.md

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartcity-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set in .env}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ml-service:
    build: ./ml-service
    container_name: smartcity-ml
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      - snapshots:/data/snapshots
      - ml-models:/root/.cache/ultralytics
    environment:
      YOLO_WEIGHTS: yolov8n.pt
      DEVICE: cpu
      UPLOADS_DIR: /data/uploads
      SNAPSHOTS_DIR: /data/snapshots

  backend:
    build:
      context: ./backend
    container_name: smartcity-api
    ports:
      - "5000:8080"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Server=db,1433;Database=IncidentDetection;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False"
      MlService__BaseUrl: http://ml-service:8000
      Storage__UploadsPath: /data/uploads
      Storage__SnapshotsPath: /data/snapshots
    volumes:
      - uploads:/data/uploads
      - snapshots:/data/snapshots
    depends_on:
      db:
        condition: service_healthy
      ml-service:
        condition: service_started

  # frontend:
  #   build: ./frontend
  #   ports: ["4200:4200"]
  #   depends_on: [backend]

volumes:
  sqldata:
  uploads:
  snapshots:
  ml-models:
