# Continuous integration — build backend + container images on every push/PR to main.
# CD (deploy) is a separate workflow when you have a cloud target (Azure, etc.).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: "8.0.x"

jobs:
  backend:
    name: .NET API build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/SmartCity.Api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Publish
        run: dotnet publish --no-build -c Release -o ./publish

  docker-images:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ml-service image
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          push: false
          tags: smartcity-ml:ci

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: smartcity-api:ci
